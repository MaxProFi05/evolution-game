<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skywild Evolution</title>
<link rel="stylesheet" href="css/style.css">
</head><body>
<canvas id="game"></canvas>
<div id="menu" class="overlay"><div class="card">
<h1>SKYWILD EVOLUTION</h1><p>Выживай. Охоться. Эволюционируй.</p>
<input id="nickname" placeholder="Имя игрока" maxlength="16">
<button id="play">ИГРАТЬ</button>
<p class="small">Сохранение работает в браузере.</p></div></div>
<div id="hud" class="hidden">
<div class="panel"><b id="formName">Искра</b>
<div class="row">❤️ <div class="bar"><i id="hp"></i></div></div>
<div class="row">⚡ <div class="bar energy"><i id="energy"></i></div></div>
<div class="row" id="airRow">🫧 <div class="bar air"><i id="air"></i></div></div>
<div class="row">⭐ <div class="bar xp"><i id="xp"></i></div></div>
<div id="info"></div></div>
<div class="help">ЛКМ — движение и атака<br>WASD — движение<br>SPACE — ускорение</div>
</div>
<div id="minimapBox" class="hidden"><canvas id="minimap" width="180" height="110"></canvas><div id="biome"></div></div>
<script src="js/data.js"></script><script src="js/game.js"></script>
</body></html>
